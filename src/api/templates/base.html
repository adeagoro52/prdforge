<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PRDForge{% endblock %}</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX for dynamic updates -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Alpine.js for interactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        /* Custom animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        /* Status colors */
        .status-pending { color: #6b7280; }
        .status-running { color: #3b82f6; }
        .status-paused { color: #f59e0b; }
        .status-completed { color: #10b981; }
        .status-failed { color: #ef4444; }
        .status-cancelled { color: #6b7280; }

        .bg-status-pending { background-color: #6b7280; }
        .bg-status-running { background-color: #3b82f6; }
        .bg-status-paused { background-color: #f59e0b; }
        .bg-status-completed { background-color: #10b981; }
        .bg-status-failed { background-color: #ef4444; }
        .bg-status-cancelled { background-color: #6b7280; }

        /* Health indicator colors */
        .health-healthy { background-color: #10b981; }
        .health-warning { background-color: #f59e0b; }
        .health-failing { background-color: #ef4444; }
        .health-inactive { background-color: #9ca3af; }
        .health-unknown { background-color: #6b7280; }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full">
    <div class="min-h-full">
        <!-- Navigation -->
        <nav class="bg-indigo-600">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 items-center justify-between">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <a href="/" class="text-white font-bold text-xl">
                                PRDForge
                            </a>
                        </div>
                        <div class="ml-10 flex items-baseline space-x-4">
                            <a href="/" class="{% if request.url.path == '/' %}bg-indigo-700{% endif %} text-white rounded-md px-3 py-2 text-sm font-medium hover:bg-indigo-500">
                                Dashboard
                            </a>
                            <a href="/projects" class="{% if '/projects' in request.url.path and '/skills' not in request.url.path %}bg-indigo-700{% endif %} text-white rounded-md px-3 py-2 text-sm font-medium hover:bg-indigo-500">
                                Projects
                            </a>
                            <a href="/skills" class="{% if '/skills' in request.url.path %}bg-indigo-700{% endif %} text-white rounded-md px-3 py-2 text-sm font-medium hover:bg-indigo-500">
                                Skills
                            </a>
                            <a href="/executors" class="{% if '/executors' in request.url.path %}bg-indigo-700{% endif %} text-white rounded-md px-3 py-2 text-sm font-medium hover:bg-indigo-500">
                                Executors
                            </a>
                            <a href="/costs" class="{% if '/costs' in request.url.path %}bg-indigo-700{% endif %} text-white rounded-md px-3 py-2 text-sm font-medium hover:bg-indigo-500">
                                Costs
                            </a>
                            <a href="/quality-gates" class="{% if '/quality-gates' in request.url.path %}bg-indigo-700{% endif %} text-white rounded-md px-3 py-2 text-sm font-medium hover:bg-indigo-500">
                                Quality Gates
                            </a>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <!-- Project Switcher -->
                        <div x-data="projectSwitcher()" @keydown.window.p.ctrl.prevent="open = true" class="relative">
                            <button @click="open = !open" class="flex items-center space-x-2 bg-indigo-700 hover:bg-indigo-800 text-white rounded-md px-3 py-2 text-sm font-medium">
                                <span x-show="selectedProject" class="flex items-center">
                                    <span class="w-2 h-2 rounded-full mr-2" :class="'health-' + (selectedProject?.health || 'unknown')"></span>
                                    <span x-text="selectedProject?.name || 'Select Project'"></span>
                                </span>
                                <span x-show="!selectedProject">All Projects</span>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <div x-show="open" @click.away="open = false" x-transition
                                class="absolute right-0 mt-2 w-64 bg-white rounded-md shadow-lg py-1 z-50">
                                <!-- All Projects option -->
                                <button @click="selectProject(null)" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
                                    <span class="w-2 h-2 rounded-full bg-gray-400 mr-2"></span>
                                    All Projects
                                    <span x-show="!selectedProject" class="ml-auto text-indigo-600">✓</span>
                                </button>
                                <hr class="my-1">
                                <!-- Project list -->
                                <template x-for="project in projects" :key="project.id">
                                    <button @click="selectProject(project)" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
                                        <span class="w-2 h-2 rounded-full mr-2" :class="'health-' + project.health"></span>
                                        <span x-text="project.name" class="truncate"></span>
                                        <span x-show="project.id === selectedProject?.id" class="ml-auto text-indigo-600">✓</span>
                                    </button>
                                </template>
                                <template x-if="projects.length === 0">
                                    <div class="px-4 py-2 text-sm text-gray-500">No projects yet</div>
                                </template>
                            </div>
                        </div>

                        <!-- User Menu -->
                        <div x-data="userMenu()" class="relative">
                            <template x-if="user">
                                <button @click="open = !open" class="flex items-center space-x-2 text-white hover:text-indigo-200">
                                    <div class="w-8 h-8 rounded-full bg-indigo-800 flex items-center justify-center">
                                        <span x-text="user.username.charAt(0).toUpperCase()" class="font-medium"></span>
                                    </div>
                                    <span x-text="user.display_name || user.username" class="text-sm hidden sm:inline"></span>
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </button>
                            </template>
                            <template x-if="!user">
                                <a href="/login" class="text-white hover:text-indigo-200 text-sm font-medium">
                                    Sign In
                                </a>
                            </template>
                            <div x-show="open && user" @click.away="open = false" x-transition
                                class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50">
                                <div class="px-4 py-2 border-b">
                                    <p class="text-sm font-medium text-gray-900" x-text="user?.display_name || user?.username"></p>
                                    <p class="text-xs text-gray-500" x-text="user?.email"></p>
                                    <span class="inline-flex items-center px-2 py-0.5 mt-1 rounded text-xs font-medium"
                                          :class="user?.role === 'admin' ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'"
                                          x-text="user?.role"></span>
                                </div>
                                <a href="/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                    <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    </svg>
                                    Settings
                                </a>
                                <button @click="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">
                                    <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                    </svg>
                                    Sign Out
                                </button>
                            </div>
                        </div>

                        <span class="text-indigo-200 text-sm">v0.1.0</span>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Page Header -->
        <header class="bg-white shadow">
            <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
                <h1 class="text-3xl font-bold tracking-tight text-gray-900">
                    {% block header %}PRDForge{% endblock %}
                </h1>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <div class="mx-auto max-w-7xl py-6 sm:px-6 lg:px-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Toast notifications container -->
    <div id="toast-container" class="fixed bottom-4 right-4 space-y-2" x-data="{ toasts: [] }">
        <template x-for="toast in toasts" :key="toast.id">
            <div
                x-show="toast.visible"
                x-transition
                class="rounded-md p-4 shadow-lg"
                :class="{
                    'bg-green-50 text-green-800': toast.type === 'success',
                    'bg-red-50 text-red-800': toast.type === 'error',
                    'bg-blue-50 text-blue-800': toast.type === 'info'
                }"
            >
                <p x-text="toast.message"></p>
            </div>
        </template>
    </div>

    <!-- Project Switcher Script -->
    <script>
        function projectSwitcher() {
            return {
                open: false,
                projects: [],
                selectedProject: null,

                init() {
                    // Load projects from API
                    this.loadProjects();

                    // Restore last selected project from localStorage
                    const savedProjectId = localStorage.getItem('prdforge_active_project');
                    if (savedProjectId) {
                        this.restoreProject(parseInt(savedProjectId));
                    }

                    // Listen for project changes from other tabs
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'prdforge_active_project') {
                            this.restoreProject(e.newValue ? parseInt(e.newValue) : null);
                        }
                    });
                },

                async loadProjects() {
                    try {
                        const response = await fetch('/api/projects');
                        this.projects = await response.json();

                        // Restore selected project after loading
                        const savedProjectId = localStorage.getItem('prdforge_active_project');
                        if (savedProjectId) {
                            this.restoreProject(parseInt(savedProjectId));
                        }
                    } catch (error) {
                        console.error('Failed to load projects:', error);
                    }
                },

                restoreProject(projectId) {
                    if (projectId && this.projects.length > 0) {
                        this.selectedProject = this.projects.find(p => p.id === projectId) || null;
                    } else {
                        this.selectedProject = null;
                    }
                },

                selectProject(project) {
                    this.selectedProject = project;
                    this.open = false;

                    // Save to localStorage
                    if (project) {
                        localStorage.setItem('prdforge_active_project', project.id.toString());
                    } else {
                        localStorage.removeItem('prdforge_active_project');
                    }

                    // Dispatch event for other components to react
                    window.dispatchEvent(new CustomEvent('project-changed', { detail: project }));

                    // Reload page content based on selected project
                    if (window.htmx) {
                        htmx.trigger(document.body, 'project-changed');
                    }
                }
            };
        }

        function userMenu() {
            return {
                open: false,
                user: null,

                init() {
                    this.loadUser();

                    // Listen for auth changes from other tabs
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'prdforge_token' || e.key === 'prdforge_user') {
                            this.loadUser();
                        }
                    });
                },

                getToken() {
                    return localStorage.getItem('prdforge_token') || sessionStorage.getItem('prdforge_token');
                },

                async loadUser() {
                    const token = this.getToken();
                    if (!token) {
                        this.user = null;
                        return;
                    }

                    // First try to load from localStorage for quick display
                    const cachedUser = localStorage.getItem('prdforge_user');
                    if (cachedUser) {
                        try {
                            this.user = JSON.parse(cachedUser);
                        } catch (e) {}
                    }

                    // Then validate with server
                    try {
                        const response = await fetch(`/api/auth/me?token=${token}`);
                        if (response.ok) {
                            this.user = await response.json();
                            localStorage.setItem('prdforge_user', JSON.stringify(this.user));
                        } else if (response.status === 401) {
                            // Token expired or invalid
                            this.clearAuth();
                        }
                    } catch (e) {
                        console.error('Failed to validate session:', e);
                    }
                },

                async logout() {
                    const token = this.getToken();
                    if (token) {
                        try {
                            await fetch(`/api/auth/logout?token=${token}`, { method: 'POST' });
                        } catch (e) {}
                    }
                    this.clearAuth();
                    window.location.href = '/login';
                },

                clearAuth() {
                    localStorage.removeItem('prdforge_token');
                    sessionStorage.removeItem('prdforge_token');
                    localStorage.removeItem('prdforge_user');
                    this.user = null;
                    this.open = false;
                }
            };
        }
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
