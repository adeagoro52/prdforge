[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prdforge"
version = "0.1.0"
description = "Where PRDs are forged into code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",
    # Configuration
    "pyyaml>=6.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Web (Phase 2, but include now for serve command)
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
prdforge = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
