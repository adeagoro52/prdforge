[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prdforge"
version = "0.1.0"
description = "Where PRDs are forged into code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # CLI
    "click>=8.1.0",
    # Configuration (YAML support is optional)
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
web = [
    # Web (Phase 2)
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",  # For form handling
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",  # For TestClient
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
prdforge = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
