[project]
name = "prdforge"
version = "0.1.0"
description = "Where PRDs are forged into code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    # "fastapi>=0.104.0",
    # "uvicorn>=0.24.0",
    # TBD - add dependencies as needed
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
prdforge = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
